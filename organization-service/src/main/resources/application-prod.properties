# Production profile
spring.application.name=organization-service

spring.datasource.url=${ORGANIZATION_DB_URL}
spring.datasource.username=${ORGANIZATION_DB_USERNAME}
spring.datasource.password=${ORGANIZATION_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.alpacaflow.meditrackplatform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

documentation.application.description=@project.description@
documentation.application.version=@project.version@

authorization.jwt.secret=${JWT_SECRET}
services.iam.url=${IAM_SERVICE_URL}
