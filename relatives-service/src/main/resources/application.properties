# Spring Application Name
spring.application.name=relatives-service

# Server Configuration
server.port=8084

# Spring DataSource Configuration (database per service)
spring.datasource.url=jdbc:mysql://localhost:3306/meditrack_relatives?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.alpacaflow.meditrackplatform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration (same secret as iam-service, used only to validate tokens)
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials

# Other services (ACL)
services.organization.url=http://localhost:8082
